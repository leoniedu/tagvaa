name: TagRecorder

options:
  bundleIdPrefix: com.eleon
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.40.0"

packages:
  RecorderCore:
    path: RecorderCore

targets:
  TagRecorder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TagRecorder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eleon.tagvaa.recorder
        PRODUCT_NAME: tagvaa
        INFOPLIST_FILE: TagRecorder/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # Mac Catalyst lets the app compile and run on a Mac without the iOS
        # platform installed (and record from a Tag on the desk).
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        "MACOSX_DEPLOYMENT_TARGET[sdk=macosx*]": "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # Set here, not in Xcode's UI: the project is generated and a team chosen
        # in Signing & Capabilities is lost on the next `xcodegen generate`.
        DEVELOPMENT_TEAM: 994QVUGPX7
    dependencies:
      - package: RecorderCore
        product: RecorderCore

schemes:
  TagRecorder:
    build:
      targets:
        TagRecorder: all
    run:
      config: Debug
    archive:
      config: Release
