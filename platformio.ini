; Paddle Stroke — custom firmware for the RAK WisMesh Tag (nRF52840 / RAK4630).
; Platform, core and toolchain are pinned to the same versions Meshtastic uses
; (meshtastic/firmware variants/nrf52840/nrf52.ini @ 6d41e27).
;
; One environment per milestone; each builds its own firmware/<env>.uf2.

[platformio]
default_envs = m1_hello, m2_accel, m3_csc, m4_logger, m5_stroke, m5_acf, t_rail

[env]
platform = platformio/nordicnrf52@11.0.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino#0fd295f13203e93df19d578073646ec32f2bf45a
  platformio/toolchain-gccarmnoneeabi@1.120301.0
framework = arduino

; Board definition copied from meshtastic/firmware boards/wiscore_rak4631.json
; (S140 SoftDevice 6.1.1 memory layout, app starts at 0x26000).
board = wiscore_rak4631

; Our own pin map (variants/wismesh_tag), derived from Meshtastic's rak_wismeshtag variant.
board_build.variants_dir = variants
board_build.variant = wismesh_tag

build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11

monitor_speed = 115200

; Converts firmware.hex -> firmware.uf2 after every build.
extra_scripts = post:scripts/make_uf2.py

[env:m1_hello]
build_src_filter = +<m1_hello/>

[env:m2_accel]
build_src_filter = +<m2_accel/>

[env:m3_csc]
build_src_filter = +<m3_csc/>

[env:m4_logger]
build_src_filter = +<m4_logger/>

[env:m5_stroke]
build_src_filter = +<m5_stroke/>

[env:m5_acf]
build_src_filter = +<m5_acf/>

; Test: what does the switched 3.3 V rail power (accelerometer? GNSS?), and its current.
[env:t_rail]
build_src_filter = +<t_rail/>
